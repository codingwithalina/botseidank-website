<style>
:root{
  --ink:#2A0A52;--ink-2:#5B4A78;--accent:#6234BC;--mint:#A5FCDF;--line:rgba(98,52,188,.16);
  --card:rgba(255,255,255,.72);--f-d:"Bricolage Grotesque",system-ui,sans-serif;--f-t:"Instrument Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:32px 16px;font-family:var(--f-t);color:var(--ink);background:#F6F2FF;
  background-image:
    radial-gradient(60% 45% at 15% 10%,rgba(165,252,223,.75),transparent 70%),
    radial-gradient(55% 45% at 90% 20%,rgba(98,52,188,.28),transparent 70%),
    radial-gradient(70% 50% at 50% 100%,rgba(165,252,223,.45),transparent 70%);
}
.c{width:100%;max-width:440px;text-align:center;background:var(--card);border:1px solid var(--line);
  border-radius:28px;padding:36px 22px 26px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 30px 60px -30px rgba(42,10,82,.35)}
.firm{font:700 15px/1 var(--f-d);letter-spacing:.02em;color:var(--accent)}
.stars{color:#F2B33D;font-size:26px;letter-spacing:5px;margin:16px 0 8px}
h1{font:700 clamp(24px,6.5vw,30px)/1.15 var(--f-d);margin:0 0 10px;letter-spacing:-.01em}
p.sub{color:var(--ink-2);margin:0 0 26px;line-height:1.55;font-size:15.5px}
nav{display:grid;gap:10px}
.b{display:flex;align-items:center;gap:12px;min-height:56px;padding:14px 18px;border-radius:16px;
  text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);font:600 16px/1.2 var(--f-t);
  transition:transform .2s,box-shadow .2s}
.b:hover,.b:focus-visible{transform:translateY(-1px);box-shadow:0 10px 24px -14px rgba(42,10,82,.45)}
.b:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.b.first{background:var(--accent);border-color:var(--accent);color:#fff}
.b.first .d{outline:2px solid #fff}
.d{width:10px;height:10px;border-radius:50%;flex:none}
.t{flex:1;text-align:left}
.a{opacity:.65}
.ph{font:600 11px/1 var(--f-t);font-style:normal;text-transform:uppercase;letter-spacing:.06em;
  padding:5px 7px;border-radius:6px;background:#D8456B;color:#fff}
.f{font-size:13.5px;color:var(--ink-2);margin-top:22px;line-height:1.5}
.f a{color:var(--accent)}
</style>
